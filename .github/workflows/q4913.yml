name: Q4913 temporary computation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/q4913.yml'
      - 'static/q4913/compute.py'
  push:
    branches: [q4913-compute-run]
    paths:
      - '.github/workflows/q4913.yml'
      - 'static/q4913/compute.py'

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q4913-compute-run
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install mpmath
      - run: python static/q4913/compute.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/q4913/index.html
          git diff --cached --quiet || git commit -m 'Record Q4913 numerical result'
          git push origin HEAD:q4913-compute-run
